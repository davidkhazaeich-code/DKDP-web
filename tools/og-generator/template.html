<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@400;600;800;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1376px;
    height: 768px;
    overflow: hidden;
    font-family: 'Geist', 'Inter', system-ui, sans-serif;
    color: #ffffff;
    background: var(--bg, #0A0A0A);
    -webkit-font-smoothing: antialiased;
  }

  .frame {
    position: relative;
    width: 1376px;
    height: 768px;
    background: var(--bg, #0A0A0A);
    overflow: hidden;
    isolation: isolate;
  }

  /* Layered glows (radial blobs) */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
    z-index: 0;
  }
  .blob.primary {
    width: 920px; height: 920px;
    background: var(--accent, #7C3AED);
    opacity: 0.32;
    top: -180px; left: 50%;
    transform: translateX(-50%);
  }
  .blob.secondary {
    width: 520px; height: 520px;
    background: var(--accent2, #FF6B00);
    opacity: 0.18;
    bottom: -180px; right: -100px;
  }
  .blob.tertiary {
    width: 420px; height: 420px;
    background: var(--accent, #7C3AED);
    opacity: 0.14;
    top: 320px; left: -150px;
  }

  /* Subtle grid overlay */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 90%);
    z-index: 1;
  }

  /* Outer rounded border */
  .border {
    position: absolute;
    inset: 28px;
    border-radius: 24px;
    border: 1.5px solid var(--border, rgba(167, 139, 250, 0.28));
    z-index: 2;
    pointer-events: none;
  }

  /* Content layer */
  .content {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 0 96px;
    text-align: center;
  }

  .pillar-label {
    font-family: 'Geist', 'Inter', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--accent-soft, #A78BFA);
    margin-bottom: 28px;
    opacity: 0.85;
  }

  .title {
    font-family: 'Geist', 'Inter', sans-serif;
    font-weight: 800;
    font-size: var(--title-size, 108px);
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: #ffffff;
    margin-bottom: 32px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }

  .title.smaller { font-size: 84px; }
  .title.smallest { font-size: 68px; }

  .subtitle {
    font-family: 'Geist', 'Inter', sans-serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.4;
    color: var(--accent-soft, #A78BFA);
    max-width: 1100px;
  }

  .subtitle .sep {
    color: var(--accent-soft, #A78BFA);
    opacity: 0.6;
    margin: 0 14px;
  }

  /* DKDP wordmark bottom right */
  .wordmark {
    position: absolute;
    bottom: 56px;
    right: 80px;
    font-family: 'Geist', 'Inter', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.04em;
    color: #ffffff;
    z-index: 4;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .wordmark .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent, #7C3AED);
    display: inline-block;
    margin-left: 2px;
  }

  /* Location tag bottom left */
  .location {
    position: absolute;
    bottom: 60px;
    left: 80px;
    font-family: 'Geist', 'Inter', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .location .pin {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent, #7C3AED);
    box-shadow: 0 0 12px var(--accent, #7C3AED);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="blob primary"></div>
  <div class="blob secondary"></div>
  <div class="blob tertiary"></div>
  <div class="grid"></div>
  <div class="border"></div>

  <div class="content">
    <div class="pillar-label" id="pillar"></div>
    <h1 class="title" id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <div class="location">
    <span class="pin"></span>
    <span>Genève · Suisse</span>
  </div>
  <div class="wordmark">DKDP<span class="dot"></span></div>
</div>
</body>
</html>
